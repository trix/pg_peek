default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5444) %>

development:
  primary:
    <<: *default
    database: pg_peek_development
  queue:
    <<: *default
    database: pg_peek_queue_development
    migrations_paths: db/queue_migrate
  analytics:
    <<: *default
    database: pg_peek_analytics_development
    migrations_paths: db/analytics_migrate

test:
  primary:
    <<: *default
    database: pg_peek_test
  queue:
    <<: *default
    database: pg_peek_queue_test
    migrations_paths: db/queue_migrate
  analytics:
    <<: *default
    database: pg_peek_analytics_test
    migrations_paths: db/analytics_migrate
